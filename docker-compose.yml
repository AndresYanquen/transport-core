services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: taxi-backend
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - redis

  admin-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
        VITE_SOCKET_PATH: /socket.io
    image: taxi-admin-client
    ports:
      - "8080:80"
    depends_on:
      - backend
