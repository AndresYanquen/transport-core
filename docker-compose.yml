services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: taxi-backend
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    ports:
      - "3000:3000"

  admin-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
        VITE_SOCKET_PATH: /socket.io
    image: taxi-admin-client
    ports:
      - "8080:80"
    depends_on:
      - backend
